name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  autogenerated:
    name: Autogenerated Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - doppler-cli
          - volume-permissions
        baseImage:
          - debian:latest
          - ubuntu:latest
          - alpine:latest
          - fedora:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  autogenerated-results:
    name: Autogenerated Test Results
    runs-on: ubuntu-latest
    needs: autogenerated
    if: ${{ always() }}
    steps:
      - name: Determine status
        run: ${{ needs.autogenerated.result == 'success' }} || ${{ needs.autogenerated.result == 'skipped' }}

  scenarios:
    name: Scenarios Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        features:
          - doppler-cli
          - volume-permissions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated .

  scenarios-results:
    name: Scenarios Test Results
    runs-on: ubuntu-latest
    needs: scenarios
    if: ${{ always() }}
    steps:
      - name: Determine status
        run: ${{ needs.scenarios.result == 'success' }} || ${{ needs.scenarios.result == 'skipped' }}

  global:
    name: Global Test Scenarios
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Testing global scenarios"
        run: devcontainer features test --global-scenarios-only .
